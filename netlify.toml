[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.wikimedia.org https://*.wikipedia.org; connect-src 'self' https://*.supabase.co https://*.wikipedia.org https://commons.wikimedia.org;"
